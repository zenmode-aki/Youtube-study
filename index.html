<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Study Tube</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
  <script>
    // 画面がちらつかないよう、読み込みの最初にテーマを当てる
    try {
      const t = JSON.parse(localStorage.getItem("study:prefs"))?.theme;
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch {}
  </script>
  <!-- 動画を押してから流れるまでを少しでも速くするため、YouTube に先につないでおく -->
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">📺 <span>My Study Tube</span></div>
      <div class="points" id="points"></div>
      <button class="sleep-btn" id="sleepBtn">🌙 おやすみモード</button>
      <button class="sleep-btn song-btn" id="songBtn">🎵 歌</button>
      <nav id="nav"></nav>
      <p class="fetched" id="fetched"></p>
    </aside>

    <main class="main">
      <header class="toolbar">
        <button class="menu-btn" id="menuBtn" aria-label="メニュー">☰</button>
        <div class="search">
          <input id="search" type="search" placeholder="タイトルで検索…" autocomplete="off">
        </div>
        <select id="sort" aria-label="並び順">
          <option value="default">おすすめ順</option>
          <option value="new">新しい順</option>
          <option value="old">古い順</option>
          <option value="views">再生回数順</option>
          <option value="short">短い順</option>
        </select>
        <label class="toggle"><input type="checkbox" id="hideWatched"> 視聴済みを隠す</label>
        <button class="theme-btn" id="themeBtn"></button>
      </header>

      <section class="heading">
        <div class="heading-row">
          <h1 id="title">すべて</h1>
          <button class="shuffle-play" id="shufflePlay">🔀 シャッフル再生</button>
        </div>
        <p id="subtitle"></p>
      </section>

      <section class="workout-panel" id="workoutPanel" hidden>
        <div class="wp-streak"><b id="wpStreak">0</b><span>日連続 🔥</span></div>
        <div class="wp-main">
          <p class="wp-sub" id="wpSub"></p>
          <div class="wp-days" id="wpDays"></div>
          <p class="wp-stats" id="wpStats"></p>
        </div>
        <button class="wp-check" id="wpCheck"></button>
      </section>

      <section class="grid" id="grid"></section>
      <p class="empty" id="empty" hidden>動画が見つかりませんでした。</p>
    </main>
  </div>

  <div class="player-backdrop" id="playerBackdrop" hidden>
    <div class="player" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
      <div class="player-frame"><div id="ytPlayer"></div></div>
      <div class="player-pct"><span id="playerPctBar"></span></div>
      <div class="player-info">
        <div>
          <h2 id="playerTitle"></h2>
          <p id="playerMeta"></p>
        </div>
        <button class="close" id="closePlayer" aria-label="閉じる">✕</button>
      </div>
      <div class="player-controls">
        <div class="speeds" id="speeds"></div>
        <span class="pct-label" id="playerPct"></span>
        <div class="spacer"></div>
        <button id="prevBtn">⏮ 前へ</button>
        <button id="watchedBtn"></button>
        <button id="nextBtn">次へ ⏭</button>
        <button id="shuffleBtn"></button>
        <button id="repeatBtn"></button>
        <button id="sleepTimerBtn"></button>
        <button id="workoutLogBtn" class="workout-log-inline" hidden></button>
        <label class="toggle"><input type="checkbox" id="autoNext" checked> 自動で次へ</label>
      </div>
    </div>
  </div>

  <div class="sleep" id="sleep" hidden>
    <div class="sleep-setup" id="sleepSetup">
      <div class="moon">🌙</div>
      <h2>おやすみモード</h2>
      <p id="sleepSource"></p>
      <div class="sleep-minutes" id="sleepMinutes"></div>
      <p class="sleep-note">最後の5分で少しずつ音量が下がって、自動で止まります。<br>寝ながら聞くので、ポイントや視聴%には数えません。</p>
      <button class="sleep-start" id="sleepStart">再生をはじめる</button>
      <button class="sleep-link" id="sleepCancel">戻る</button>
    </div>
    <div class="sleep-playing" id="sleepPlaying" hidden>
      <div class="sleep-frame"><div id="sleepYt"></div></div>
      <div class="sleep-clock" id="sleepClock"></div>
      <p class="sleep-title" id="sleepTitle"></p>
      <div class="sleep-actions">
        <button id="sleepSkip">次の動画 ⏭</button>
        <button id="sleepToggleVideo">映像を表示</button>
        <button id="sleepStop">終了</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="data/videos.js"></script>
  <script src="app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
